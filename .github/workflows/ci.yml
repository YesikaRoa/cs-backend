name: CI - Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup .env.test
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.test
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.test
          echo "PORT=${{ secrets.PORT }}" >> .env.test
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env.test
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env.test
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env.test
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env.test
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env.test
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env.test
          echo "REDIS_USER=${{ secrets.REDIS_USER }}" >> .env.test
          echo "REDIS_PASS=${{ secrets.REDIS_PASS }}" >> .env.test
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.test
          echo "REDIS_TIMEOUT=${{ secrets.REDIS_TIMEOUT }}" >> .env.test

      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cs-backend
            git pull origin main
            npm install --omit=dev
            pm2 restart cs-backend || pm2 start npm --name cs-backend -- run start
